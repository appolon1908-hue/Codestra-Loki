auth_enabled: true
target: all

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_address: 0.0.0.0
  grpc_listen_port: 9095
  log_level: info
  log_format: json
  http_server_read_timeout: 120s
  http_server_write_timeout: 120s

common:
  path_prefix: /var/lib/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: ${LOKI_S3_ENDPOINT}
      bucketnames: ${LOKI_S3_BUCKET}
      s3forcepathstyle: true
      insecure: false

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: codestra_loki_index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /var/lib/loki/index
    cache_location: /var/lib/loki/index-cache

runtime_config:
  file: /etc/loki/runtime/overrides.yaml

compactor:
  working_directory: /var/lib/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: s3

frontend:
  compress_responses: true
  log_queries_longer_than: 10s

query_range:
  align_queries_with_step: true
  parallelise_shardable_queries: true
  max_retries: 3
  cache_results: true

limits_config:
  allow_structured_metadata: true
  discover_log_levels: true
  volume_enabled: true
  retention_period: 744h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_global_streams_per_user: 5000
  max_query_parallelism: 16
  max_query_length: 744h
  query_timeout: 120s
  split_queries_by_interval: 1h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  max_label_name_length: 128
  max_label_value_length: 2048
  max_label_names_per_series: 20
  max_line_size: 256KB
  retention_stream:
    - selector: '{stream_class="security_audit"}'
      priority: 10
      period: 2160h
    - selector: '{stream_class="debug"}'
      priority: 20
      period: 168h

analytics:
  reporting_enabled: false
