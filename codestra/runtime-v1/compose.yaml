name: codestra-loki

services:
  loki:
    image: ${LOKI_IMAGE:?LOKI_IMAGE must be an immutable image digest}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        export LOKI_S3_ACCESS_KEY_ID="$$(cat /run/secrets/loki_s3_access_key_id)"
        export LOKI_S3_SECRET_ACCESS_KEY="$$(cat /run/secrets/loki_s3_secret_access_key)"
        exec /usr/bin/loki \
          -config.file=/etc/loki/loki.yaml \
          -config.expand-env=true
    environment:
      LOKI_S3_ENDPOINT: ${LOKI_S3_ENDPOINT:?set the private object-storage endpoint}
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET:?set the dedicated Loki bucket}
    secrets:
      - loki_s3_access_key_id
      - loki_s3_secret_access_key
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - ./overrides.yaml:/etc/loki/runtime/overrides.yaml:ro
      - loki_data:/var/lib/loki
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - codestra_observability
    stop_grace_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G

secrets:
  loki_s3_access_key_id:
    file: ${LOKI_S3_ACCESS_KEY_ID_FILE:?mount an OpenBao-rendered access-key file}
  loki_s3_secret_access_key:
    file: ${LOKI_S3_SECRET_ACCESS_KEY_FILE:?mount an OpenBao-rendered secret-key file}

volumes:
  loki_data:

networks:
  codestra_observability:
    external: true
    name: codestra-observability
